name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
          VITE_TENANT_ID: ${{ secrets.VITE_TENANT_ID }}
          VITE_SHAREPOINT_SITE_URL: ${{ secrets.VITE_SHAREPOINT_SITE_URL }}
          VITE_LIST_NAME: ${{ secrets.VITE_LIST_NAME }}
          VITE_SERVICES_LIST: ${{ secrets.VITE_SERVICES_LIST }}
          VITE_CLIENTS_LIST: ${{ secrets.VITE_CLIENTS_LIST }}
          VITE_SPECIALISTS_LIST: ${{ secrets.VITE_SPECIALISTS_LIST }}
          VITE_DOCUMENT_LIBRARY: ${{ secrets.VITE_DOCUMENT_LIBRARY }}
          VITE_PRESALES_CALENDAR_EMAIL: ${{ secrets.VITE_PRESALES_CALENDAR_EMAIL }}
          VITE_MANAGER_EMAILS: ${{ secrets.VITE_MANAGER_EMAILS }}
          VITE_APP_NAME: DWx Traffic Manager

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_OCEAN_051AA7B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_OCEAN_051AA7B03 }}
          action: "close"
