# Azure DevOps Pipeline - DWx Traffic Manager
# Converted from GitHub Actions: azure-static-web-apps-orange-ocean-051aa7b03.yml

trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: dwx-traffic-manager-vars

stages:
  - stage: BuildAndDeploy
    displayName: 'Build and Deploy'
    jobs:
      - job: BuildAndDeploy
        displayName: 'Build and Deploy Job'
        steps:
          - checkout: self
            submodules: true

          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build'
            env:
              VITE_CLIENT_ID: $(VITE_CLIENT_ID)
              VITE_TENANT_ID: $(VITE_TENANT_ID)
              VITE_SHAREPOINT_SITE_URL: $(VITE_SHAREPOINT_SITE_URL)
              VITE_LIST_NAME: $(VITE_LIST_NAME)
              VITE_SERVICES_LIST: $(VITE_SERVICES_LIST)
              VITE_CLIENTS_LIST: $(VITE_CLIENTS_LIST)
              VITE_SPECIALISTS_LIST: $(VITE_SPECIALISTS_LIST)
              VITE_TEAM_MEMBERS_LIST: $(VITE_TEAM_MEMBERS_LIST)
              VITE_ACCOUNT_MANAGERS_LIST: $(VITE_ACCOUNT_MANAGERS_LIST)
              VITE_MANAGERS_LIST: $(VITE_MANAGERS_LIST)
              VITE_AUDIT_LOG_LIST: $(VITE_AUDIT_LOG_LIST)
              VITE_PRODUCT_REQUESTS_LIST: $(VITE_PRODUCT_REQUESTS_LIST)
              VITE_SESSION_PREP_LIST: $(VITE_SESSION_PREP_LIST)
              VITE_DOCUMENT_LIBRARY: $(VITE_DOCUMENT_LIBRARY)
              VITE_PRESALES_CALENDAR_EMAIL: $(VITE_PRESALES_CALENDAR_EMAIL)
              VITE_MANAGER_EMAILS: $(VITE_MANAGER_EMAILS)
              VITE_AZURE_OPENAI_ENDPOINT: $(VITE_AZURE_OPENAI_ENDPOINT)
              VITE_AZURE_OPENAI_API_KEY: $(VITE_AZURE_OPENAI_API_KEY)
              VITE_AZURE_OPENAI_DEPLOYMENT: $(VITE_AZURE_OPENAI_DEPLOYMENT)
              VITE_AZURE_OPENAI_API_VERSION: $(VITE_AZURE_OPENAI_API_VERSION)
              VITE_APP_NAME: 'DWx Traffic Manager'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Azure Static Web Apps'
            inputs:
              app_location: '/build'
              skip_app_build: true
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
